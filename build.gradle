apply plugin: 'com.android.application'
apply plugin: 'app.cash.paparazzi'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath 'app.cash.paparazzi:paparazzi-gradle-plugin:2.0.0-alpha05.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def getVersionName = { ->
    return 'git describe --tags'.execute(null, project.rootDir).text.trim()
}

def getVersionCodeNightly = { ->
    return Integer.valueOf('git rev-list HEAD --count'.execute(null, project.rootDir).text.trim())
}

android {
    compileOptions {
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    compileSdk = 37

    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    defaultConfig {
        applicationId 'com.waykeep.app'
        versionCode 6766
        versionName "v4.29.0"

        buildConfigField "String", "VERSION_NAME_FULL", "\"${getVersionName()}\""

        minSdk = 26
        targetSdk = 37

        testInstrumentationRunner 'com.waykeep.app.TestRunner'
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }
    testOptions {
        managedDevices {
            localDevices {
                mediumPhone {
                    device = "Medium Phone"
                    apiLevel = 35
                    systemImageSource = "aosp"
                }
            }
        }
    }
    signingConfigs {
        nightly {
            if (System.getProperty('nightly_store_file') != null) {
                storeFile file(System.getProperty('nightly_store_file'))
                storePassword System.getProperty('nightly_store_password')
                keyAlias System.getProperty('nightly_key_alias')
                keyPassword System.getProperty('nightly_key_password')
            }
        }
        release {
            if (System.getProperty("release_store_file") != null) {
                storeFile file(System.getProperty("release_store_file"))
                storePassword System.getProperty("release_store_password")
                keyAlias System.getProperty("release_key_alias")
                keyPassword System.getProperty("release_key_password")
            }
        }
    }

    namespace = 'com.waykeep.app'

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            crunchPngs = false
            minifyEnabled = false
        }
    }


    flavorDimensions 'version'
    productFlavors {
        nightly {
            dimension 'version'
            applicationId 'com.waykeep.app.nightly'

            versionCode getVersionCodeNightly()
            versionName getVersionName()
            base.archivesName = "com.waykeep.app.nightly_${getVersionCodeNightly()}"

            signingConfig = signingConfigs.nightly
        }
        irreproducible {
            // Non-reproducible: https://f-droid.org/de/packages/com.waykeep.app/
            dimension 'version'
            applicationId 'com.waykeep.app'
            versionNameSuffix 'irreproducible'
        }
        reproducible {
            // Developer Binaries: https://codeberg.org/OpenTracksApp/OSMDashboard/releases/download/v%v/com.waykeep.app.playstore_%v.apk
            // FDroid: https://f-droid.org/de/packages/com.waykeep.app.playstore
            // PlayStore: https://play.google.com/store/apps/details?id=com.waykeep.app.playstore
            dimension 'version'
            applicationId 'com.waykeep.app.playstore'

            base.archivesName = "com.waykeep.app.playstore_${getVersionName()}_${android.defaultConfig.versionCode}"

            signingConfig = signingConfigs.release
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'androidx.core:core-location-altitude:1.0.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.health.connect:connect-client:1.1.0'

    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'app.cash.paparazzi:paparazzi:2.0.0-alpha05.1'

    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.resValues.put(
                new com.android.build.api.variant.impl.ResValueKeyImpl("string", "applicationId"),
                new com.android.build.api.variant.ResValue(variant.applicationId.get(), null)
        )
    }
}
