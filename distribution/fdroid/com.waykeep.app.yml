Summary: A sport tracker buddy that respects your privacy.
Description: |-
    A sport tracking buddy that respects your privacy.

    Sport and outdoor activities grant happiness, skill and confidence. Value your health by keeping track of your training.
    Record runs and walks, and use the bike computer for cycling. Mark interesting locations along your way with pictures.
    Keep recorded statistics in detail for analysis, and share only the data you choose.

    * Voice announcements.
    * Bluetooth LE sensors: heart rate, speed and distance, cadence, and power.
    * Altitude gain and loss via the barometric sensor.
    * Export tracks as KMZ (including photos), KML, or GPX.
    * Offline-capable in-app maps, an activity feed, and a home-screen statistics widget.
    * Dark and light themes, and no ads.

    Network access is used to fetch map tiles; personal data is not uploaded.
    Licensed under GPLv3; upstream-derived parts remain Apache 2.0.
