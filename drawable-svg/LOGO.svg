<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Waykeep logo: the "Sealed Path W" from the app icon
     (src/main/res/drawable/ic_logo_color_108dp.xml), cyan on the black
     adaptive-icon tile so it reads on both light and dark backgrounds. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108"
     viewBox="0 0 108 108" role="img" aria-label="Waykeep logo">
  <title>Waykeep</title>
  <rect x="0" y="0" width="108" height="108" rx="24" fill="#000000"/>
  <path d="M24,34 L38,74 L54,50 L70,74 L84,34"
        fill="none" stroke="#00E5FF" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="54" cy="74" r="6" fill="#00E5FF"/>
</svg>
